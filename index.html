<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bodas Creativas - Plataforma de planificación y seguimiento de bodas." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#aa2d2a" />
    <script>
      // Aplica el tema antes del primer pintado para evitar un destello claro.
      (function () {
        var t = null;
        try { t = localStorage.getItem('bc_theme'); } catch (e) {}
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#161110');
        }
      })();
    </script>
    <title>Bodas Creativas | Planificación de bodas</title>
  </head>
  <body class="bg-brand-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
